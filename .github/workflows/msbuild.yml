name: Build OBSE Plugin

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout xOBSE SDK
        uses: actions/checkout@v4
        with:
          repository: llde/xOBSE
          ref: master

      - name: Checkout EditorIDMapper
        uses: actions/checkout@v4
        with:
          repository: EditorIDMapper
          ref: main
          path: EditorIDMapper

      - name: Checkout OBSEKeywords
        uses: actions/checkout@v4
        with:
          repository: OBSEKeywords
          ref: main
          path: OBSEKeywords

      - name: Checkout plugin source
        uses: actions/checkout@v4
        with:
          path: MediumArmorOB

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build
        run: msbuild MediumArmorOB/MediumArmor.sln /p:Configuration=Release /p:Platform=Win32 /m

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediumArmor
          path: |
            MediumArmorOB/Release/MediumArmor.dll
            MediumArmorOB/Release/MediumArmor.pdb
